name: Test
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: pzhlkj6612/forked-install-qt-action
          ref: 76ce10ffad2cd5138b91d705681724bc6127527b

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: action/

      - run: |
          cd action
          npm ci || npm install
          npm run build

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          target: android
          arch: android_arm64_v8a
          modules: qtwebview qtpositioning qtlocation qtpdf
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
